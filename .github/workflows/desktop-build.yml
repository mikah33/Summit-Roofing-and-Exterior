name: Build Windows Desktop App

on:
  workflow_dispatch: {}
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Build Windows app
        run: npm run dist

      - name: Upload installer + portable exe
        uses: actions/upload-artifact@v4
        with:
          name: summit-roofing-windows
          path: |
            desktop/dist/*.exe
          if-no-files-found: error

      - name: Publish GitHub Release with download links
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-latest
          name: Summit Roofing Desktop App (Windows)
          body: |
            Download and run on your Windows PC:

            - **Summit-Roofing-Setup.exe** — installer (adds Start menu + desktop shortcut)
            - **Summit-Roofing-Portable.exe** — no install, just double-click

            On first launch Windows may show a SmartScreen warning (the app isn't code-signed) — click **More info → Run anyway**.
          files: desktop/dist/*.exe
