name: Build Windows Desktop App

on:
  workflow_dispatch: {}
  push:
    tags:
      - "desktop-v*"

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Build Windows app
        run: npm run dist

      - name: Upload installer + portable exe
        uses: actions/upload-artifact@v4
        with:
          name: summit-roofing-windows
          path: |
            desktop/dist/*.exe
          if-no-files-found: error
